spring.application.name=patient-records-api
server.port=8080
server.shutdown=graceful

acme.version=${APP_VERSION:local}
acme.environment=${DEPLOY_ENV:local}
acme.pod-name=${POD_NAME:localhost}
acme.track=${HARNESS_TRACK:stable}
acme.release.regression=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.track=${acme.track}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
